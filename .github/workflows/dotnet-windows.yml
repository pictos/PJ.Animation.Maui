# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Build project on Windows

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "**.md"
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
    LIB_CSPROJ: src/PJAnimation/PJAnimation.csproj
    SAMPLE_CSPROJ: samples/PJAnimation.Sample/PJAnimation.Sample.csproj
    TESTS_CSPROJ: tests/PJAnimation.Tests/PJAnimation.Tests.csproj
    NugetPackageVersion: '99.0.0-preview${{ github.run_number }}'
    CurrentSemanticVersionBase: '99.0.0'

jobs:
  build:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.402

    - name: Get Nuget version for PR
      if: ${{ github.event_name == 'pull_request' }}
      run: echo "NugetPackageVersion=${{ env.CurrentSemanticVersionBase }}-build-${{ github.event.pull_request.number }}.${{ github.run_number }}" >> "$GITHUB_ENV"
      shell: bash

    - name: Workload install
      run: dotnet workload install maui --version 10.0.402.1

    # nuget.config lists the gitignored local feed `artifacts`; restore fails if it is missing.
    - name: Create local NuGet feed folder
      run: mkdir -p artifacts
      shell: bash

    - name: Restore library dependencies
      run: dotnet restore ${{env.LIB_CSPROJ}}

    - name: Restore test dependencies
      run: dotnet restore ${{env.TESTS_CSPROJ}}

    - name: Restore sample dependencies
      run: dotnet restore ${{env.SAMPLE_CSPROJ}}

    - name: Build library
      run: dotnet build ${{env.LIB_CSPROJ}} -c Release -p:Version=${{ env.NugetPackageVersion }} --no-restore

    - name: Run unit tests
      run: dotnet test ${{env.TESTS_CSPROJ}} -c Release --no-restore

    # iOS and Mac Catalyst apps need a Mac; they are built by the macOS workflow.
    - name: Build Sample app
      run: dotnet build ${{env.SAMPLE_CSPROJ}} -c Release -f net10.0-android --no-restore

    - name: Create Nuget
      run: dotnet pack ${{env.LIB_CSPROJ}} -c Release -p:Version=${{ env.NugetPackageVersion }} --no-restore --no-build -o "${{ github.workspace }}/nuget"

    - name: List NuGet packages found
      run: |
        Get-ChildItem -Path "${{ github.workspace }}/nuget" | Format-Table Name
      shell: pwsh

    - name: Publish Packages
      uses: actions/upload-artifact@v4
      with:
        name: packages
        path: ${{ github.workspace }}/nuget/
